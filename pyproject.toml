[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translation-framework"
version = "0.1.0"
description = "Fail-closed, resumable local translation pipeline for structured PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF==1.28.2",
]

[project.scripts]
pdf-translate = "pdf_translation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
